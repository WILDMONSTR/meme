<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="같은 캐릭터로 만드는 SNS 밈 짤 편집기">
  <title>Meme Studio — 밈 짤 편집기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Meme Studio</div>
      <div class="subtitle">같은 캐릭터, 다른 감정. 내 마음대로 만드는 밈.</div>
    </div>
    <div class="top-actions">
      <button id="newBtn" class="ghost">새 밈</button>
      <button id="downloadBtn" class="primary">PNG 저장</button>
    </div>
  </header>

  <main class="app">
    <aside class="sidebar left">
      <section class="panel">
        <h2>캐릭터 표정</h2>
        <p class="hint">포즈는 동일하고 표정만 교체됩니다.</p>
        <div id="characterGrid" class="character-grid"></div>
      </section>

      <section class="panel">
        <h2>요소 추가</h2>
        <div class="button-stack">
          <button id="addTextBtn">＋ 문구 추가</button>
          <button id="addEmojiBtn">＋ 감정 이모지</button>
          <label class="upload-btn">＋ PNG / JPEG / SVG 업로드<input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple hidden></label>
        </div>
        <div class="emoji-row" id="emojiRow"></div>
      </section>

      <section class="panel resource-library">
        <h2>기본 리소스</h2>
        <p class="hint">사이트에서 제공하는 SVG 감정 스티커와 밈 문구입니다. 클릭하면 캔버스에 추가되고 자유롭게 편집할 수 있어요.</p>
        <h3>감정 스티커</h3>
        <div id="stickerGrid" class="sticker-grid"></div>
        <h3>자주 쓰는 문구</h3>
        <div id="resourcePhraseChips" class="chips"></div>
      </section>

      <section class="panel">
        <h2>배경</h2>
        <div class="swatches" id="backgroundSwatches"></div>
      </section>
    </aside>

    <section class="workspace">
      <div class="canvas-wrap">
        <canvas id="canvas" width="1080" height="1080"></canvas>
      </div>
      <div class="workspace-tip">요소를 클릭한 뒤 드래그하세요. 모서리 핸들로 크기를 바꾸고 회전할 수 있습니다. 텍스트를 두 번 클릭하면 내용을 수정할 수 있습니다.</div>
    </section>

    <aside class="sidebar right">
      <section class="panel inspector">
        <h2>선택한 요소</h2>
        <div id="emptyInspector" class="empty">요소를 선택하면 편집 도구가 나타납니다.</div>
        <div id="inspectorControls" class="hidden">
          <label>이름<input id="objectName" type="text"></label>
          <div class="two-col">
            <label>X<input id="posX" type="number"></label>
            <label>Y<input id="posY" type="number"></label>
          </div>
          <div class="two-col">
            <label>가로<input id="objWidth" type="number" min="1"></label>
            <label>세로<input id="objHeight" type="number" min="1"></label>
          </div>
          <div class="two-col">
            <label>각도<input id="objAngle" type="number"></label>
            <label>투명도<input id="objOpacity" type="range" min="0" max="100" value="100"></label>
          </div>
          <label id="colorControl">색상<input id="objColor" type="color" value="#111827"></label>
          <div class="button-grid">
            <button id="frontBtn">맨 앞으로</button>
            <button id="backBtn">맨 뒤로</button>
            <button id="duplicateBtn">복제</button>
            <button id="deleteBtn" class="danger">삭제</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>레이어</h2>
        <div id="layers" class="layers"></div>
      </section>

      <section class="panel">
        <h2>밈 문구 예시</h2>
        <div class="chips" id="phraseChips"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
